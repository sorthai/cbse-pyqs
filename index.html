<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homi - Class 10 Maths Important Questions</title>
<link rel="icon" href="homi-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cookie&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>if (location.hash.indexOf('#/chapter') === 0) location.replace('app.html' + location.hash);</script>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  .hero { position: fixed; inset: 0; background: url(hero-left.png) center/cover no-repeat; }
  /* readability wash: fade the whole background, stronger through the text band */
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 92% 44% at 50% 45%, rgba(246,244,236,.84) 0%, rgba(246,244,236,.55) 55%, rgba(246,244,236,0) 82%);
  }
  .brand-mark {
    position: absolute; top: 22px; left: 26px; z-index: 2;
    font-family: 'Archivo Black', sans-serif; font-weight: 400;
    font-size: 20px; color: #111; letter-spacing: -0.3px; text-decoration: none;
  }
  @media (min-width: 820px) {
    .hero { background-image: url(hero-full.png); }
  }
  .hero-inner {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 0 28px; text-align: center;
  }
  .headline {
    font-family: 'Cookie', cursive; font-weight: 400;
    font-size: 62px; line-height: 1.05; color: #111;
  }
  .subline {
    font-family: 'Cookie', cursive; font-weight: 400;
    font-size: 30px; line-height: 1.15; color: #111;
  }
  .cta {
    margin-top: 22px; font-family: 'Figtree', sans-serif; font-weight: 600; font-size: 15px;
    background: #1c1c1c; color: #fff; text-decoration: none;
    padding: 12px 34px; border-radius: 999px;
  }
  .cta:active { transform: scale(.97); }
  @media (min-width: 820px) {
    .headline { font-size: 108px; }
    .subline { font-size: 46px; }
    .cta { margin-top: 30px; font-size: 16px; padding: 13px 40px; }
  }
</style>
</head>
<body>
<div class="hero">
  <a class="brand-mark" href="https://heyhomi.in">Homi</a>
  <div class="hero-inner">
    <div class="headline">Most Important Question</div>
    <div class="subline">Based on previous year papers</div>
    <a class="cta" href="app.html">Start Studying</a>
  </div>
</div>
</body>
</html>
