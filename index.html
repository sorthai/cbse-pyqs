<script>
(function () {
  var wide = document.getElementById('hw-wide');
  var stack = document.getElementById('hw-stack');
  function visibleSvg() {
    return getComputedStyle(wide).display !== 'none' ? wide : stack;
  }
  var svg = visibleSvg();
  var paths = [].slice.call(svg.querySelectorAll('path')).filter(function (p) {
    return p.getTotalLength() > 0;
  });
  var K = 0.2, MIN = 50, MAX = 130, GAP = 12;
  var SW = 16;
  var items = paths.map(function (p) {
    var len = p.getTotalLength();
    p.style.stroke = '#111';
    p.style.strokeWidth = SW;
    p.style.strokeLinecap = 'round';
    p.style.strokeLinejoin = 'round';
    p.style.fillOpacity = '0';
    p.setAttribute('fill-opacity', '0');
    p.style.strokeDasharray = String(len);
    p.style.strokeDashoffset = String(len);
    return { p: p, len: len };
  });
  var t = 0;
  items.forEach(function (it) {
    it.dur = Math.max(MIN, Math.min(MAX, it.len * K));
    it.start = t;
    t += it.dur + GAP;
  });
  var total = t - GAP;
  var subline = document.querySelector('.subline');
  var cta = document.querySelector('.cta');
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function setT(ms) {
    items.forEach(function (it) {
      var local = clamp01((ms - it.start) / it.dur);
      it.p.style.strokeDashoffset = String(it.len * (1 - local));
      var fo = clamp01((ms - (it.start + it.dur - 120)) / 120);
      it.p.style.fillOpacity = String(fo);
      it.p.style.strokeOpacity = String(1 - clamp01((ms - (it.start + it.dur)) / 150));
    });
    var sub = clamp01((ms - (total + 60)) / 400);
    subline.style.opacity = String(sub);
    subline.style.transform = 'translateY(' + (8 * (1 - sub)) + 'px)';
    var cv = clamp01((ms - (total + 200)) / 400);
    cta.style.opacity = String(cv);
    cta.style.transform = 'translateY(' + (8 * (1 - cv)) + 'px)';
  }
  window.__heroSetT = setT;
  window.__heroTotal = total + 800;
  var rafId = null;
  function start() {
    var t0 = performance.now();
    function frame(now) {
      setT(now - t0);
      if (now - t0 < total + 900) rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
  }
  var frozen = location.search.indexOf('freeze') !== -1;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setT(1e9);
  } else if (frozen) {
    setT(0);
  } else {
    start();
  }
  window.__heroStart = function () { if (rafId) cancelAnimationFrame(rafId); start(); };
